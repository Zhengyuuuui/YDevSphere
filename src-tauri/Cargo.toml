[package]
name = "ydevsphere"
version = "0.1.0"
description = "YDevSphere - a local-first developer workspace intelligence application"
authors = ["YDevSphere"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# See https://doc.rust-lang.org/cargo/reference/cargo-targets.html#the-library-target
name = "ydevsphere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 原生目录选择器（SPRINT2-01 接入）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 数据库（rusqlite bundled）
rusqlite = { version = "0.32", features = ["bundled"] }

# 目录选择 / 主目录
dirs = "5"

# 解析 pyproject.toml 的 name
toml = "0.8"

# Git 分析（SPRINT5-01 接入；git2 只读 API，绝不修改 git 状态）
git2 = "0.20"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if
# `custom-protocol` feature is disabled (default)
custom-protocol = ["tauri/custom-protocol"]
